name: collect-data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restore last published data (keeps last-good file if a source fails)
        run: |
          mkdir -p out
          for f in markets polls results status changes history calls; do
            curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/data/$f.json" -o "out/$f.json" || true
          done
      - name: Collect
        run: node scripts/collect.mjs out
      - name: Publish to data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "midterms-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
